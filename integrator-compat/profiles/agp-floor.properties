description=Plain View-based Kotlin app at the lowest AGP that builds, below the declared minimums
base=minimums
javaTarget=17
# core-ktx 1.18.0 requires AGP 8.9.1, which needs Gradle 8.11.1
gradle=8.11.1
agp=8.9.1
# Below AGP 8.12.0 the build fails on duplicate META-INF/**/MANIFEST.MF files from dependencies,
# so an integrator on this AGP must add this exclude
packagingExcludes=/META-INF/**/MANIFEST.MF
