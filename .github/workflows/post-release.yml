name: Post Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in semantic versioning format (i.e. 1.0.2)'
        required: true
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Runs the post-release workflow in Bitrise
        env:
          BITRISE_APP_ID: ${{ secrets.BITRISE_APP_ID }}
          BITRISE_BUILD_TRIGGER_TOKEN: ${{ secrets.BITRISE_BUILD_TRIGGER_TOKEN }}
          INPUT_VALUE: ${{ github.event.inputs.version }}
        run: |
          if ! [[ "$INPUT_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be in X.Y.Z format"
            exit 1
          fi
          payload=$(jq -n \
            --arg token "$BITRISE_BUILD_TRIGGER_TOKEN" \
            --arg value "$INPUT_VALUE" \
            '{hook_info: {type: "bitrise", build_trigger_token: $token}, build_params: {branch: "development", workflow_id: "post_release", environments: [{mapped_to: "NEW_VERSION", value: $value, is_expand: false}]}, triggered_by: "curl"}')
          curl "https://app.bitrise.io/app/${BITRISE_APP_ID}/build/start.json" --data "$payload"
