# Replaces the Bitrise `post_release` workflow. Run it once the release is
# visible on Maven Central: each downstream repo opens a PR that bumps its
# Widgets SDK dependency, and that PR's CI resolves the new version.
name: Post Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in semantic versioning format (i.e. 1.0.2)'
        required: true

permissions: {}

jobs:
  dispatch:
    name: Bump Widgets SDK in ${{ matrix.repo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false # one failed hop must not stop the others
      matrix:
        repo:
          - android_cortex_banking_app
          - widgets_sdk_flutter
          - widgets_sdk_ionic
          - widgets_sdk_reactnative
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be in X.Y.Z format"
            exit 1
          fi

      # Scoped to the one target repo. Needs the app installed there with
      # Actions write access.
      - name: Generate PR bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}

      - name: Dispatch set-android-sdk-version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ matrix.repo }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run set-android-sdk-version.yml \
            --repo "$REPO" --ref development -f version="$VERSION"
