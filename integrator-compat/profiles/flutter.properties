description=Flutter wrapper example app toolchain (Flutter 3.32.0, the minimum in the widgets_sdk_flutter pubspec)
source=widgets_sdk_flutter example/android/settings.gradle:22-23, gradle-wrapper.properties; compileSdk from the plugin module android/build.gradle:38
gradle=8.13
agp=8.13.0
kotlin=2.1.21
# The plugin module, which depends on Widgets, compiles against 36. The example app uses
# flutter.compileSdkVersion, 35 on Flutter 3.32.0, so an app on that default must raise it to 36.
compileSdk=36
minSdk=24
jdk=17
javaTarget=17
