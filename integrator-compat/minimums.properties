# Minimum integrator toolchain for com.glia:android-widgets.
# agp, kotlin, compileSdk and jdk are enforced by :widgetssdk:checkIntegratorRequirements;
# integrator-compat/run.sh builds a test app with all of them (profiles/minimums.properties).
# Changing a value here is a public requirement change — update the integrator docs.
gradle=8.13
agp=8.12.0
kotlin=2.2.0
compileSdk=36
minSdk=24
jdk=17
