name: Set up Android build
description: >
  JDK and Gradle with dependency caching. The JDK version and the pinned action
  SHAs live here so every workflow upgrades through one reviewed change.

inputs:
  cache-read-only:
    description: >
      Read the Gradle cache without writing it. Writing only from `development`
      keeps PR builds from evicting the shared cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
