name: Increment project version

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Version increment type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Runs the increment project version workflow in Bitrise
        env:
          BITRISE_APP_ID: ${{ secrets.BITRISE_APP_ID }}
          BITRISE_BUILD_TRIGGER_TOKEN: ${{ secrets.BITRISE_BUILD_TRIGGER_TOKEN }}
          INPUT_VALUE: ${{ github.event.inputs.type }}
        run: |
          case "$INPUT_VALUE" in
            patch|minor|major) ;;
            *) echo "::error::type must be patch, minor or major"; exit 1 ;;
          esac
          payload=$(jq -n \
            --arg token "$BITRISE_BUILD_TRIGGER_TOKEN" \
            --arg value "$INPUT_VALUE" \
            '{hook_info: {type: "bitrise", build_trigger_token: $token}, build_params: {branch: "development", workflow_id: "authenticated_increment_project_version", environments: [{mapped_to: "GITHUB_VERSION_INCREMENT_TYPE", value: $value, is_expand: false}]}, triggered_by: "curl"}')
          curl "https://app.bitrise.io/app/${BITRISE_APP_ID}/build/start.json" --data "$payload"
