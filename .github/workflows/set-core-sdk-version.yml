# Replaces the Bitrise `upgrade_dependencies` workflow. android-sdk dispatches this after
# each release:
#   gh workflow run set-core-sdk-version.yml \
#     -R salemove/android-sdk-widgets --ref development -f version=<version>
name: Set Core SDK version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Core SDK version in semantic versioning format (i.e. 1.0.2)'
        required: true

permissions:
  contents: read

# Mitigation for CVE-2026-114938 (Java4Shell). Remove once JDKs are patched.
env:
  JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi

      # A GitHub App token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't
      # trigger CI, so the required checks would never run on them.
      - name: Generate PR bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          persist-credentials: false

      - uses: ./.github/actions/setup-android-build

      - name: Set Core SDK version
        env:
          VERSION: ${{ inputs.version }}
        run: ./gradlew -q saveCoreSdkVersion --coreSdkVersion="$VERSION"

      - name: Create PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: development
          branch: core-sdk-version-increment/${{ inputs.version }}
          add-paths: version.properties
          commit-message: Increment Core SDK version to ${{ inputs.version }}
          title: Increment Core SDK version to ${{ inputs.version }}
          body: Opened by the `${{ github.workflow }}` workflow.
          team-reviewers: tm-mobile-android
