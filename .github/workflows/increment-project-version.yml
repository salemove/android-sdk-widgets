# Replaces the Bitrise `authenticated_increment_project_version` workflow.
# Also called by deployment.yml after each release, as Bitrise did with after_run.
name: Increment project version

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Version increment type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  workflow_call:
    inputs:
      type:
        required: true
        type: string
    secrets:
      PR_BOT_APP_ID:
        required: true
      PR_BOT_PRIVATE_KEY:
        required: true

permissions:
  contents: read

# Mitigation for CVE-2026-114938 (Java4Shell). Remove once JDKs are patched.
env:
  JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics

jobs:
  increment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate type
        env:
          TYPE: ${{ inputs.type }}
        run: |
          case "$TYPE" in
            patch|minor|major) ;;
            *) echo "::error::type must be patch, minor or major"; exit 1 ;;
          esac

      # A GitHub App token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't
      # trigger CI, so the required checks would never run on them.
      - name: Generate PR bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          persist-credentials: false

      - uses: ./.github/actions/setup-android-build

      - name: Increment project version
        id: bump
        env:
          TYPE: ${{ inputs.type }}
        run: |
          ./gradlew -q saveWidgetsVersion --type="$TYPE"
          echo "version=$(scripts/ci/version-name.sh)" >> "$GITHUB_OUTPUT"

      - name: Create PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: development
          branch: project-version-increment/${{ steps.bump.outputs.version }}
          add-paths: version.properties
          commit-message: Increment project version to ${{ steps.bump.outputs.version }}
          title: Increment project version to ${{ steps.bump.outputs.version }}
          body: Opened by the `${{ github.workflow }}` workflow (${{ inputs.type }} bump).
          team-reviewers: tm-mobile-android
